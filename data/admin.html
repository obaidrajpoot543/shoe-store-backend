<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Black Box - Admin Panel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f1115;
            color: white;
            padding: 30px;
        }

        .admin-container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #aaa;
            margin-bottom: 30px;
        }

        .admin-box {
            background: #171a21;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .admin-box h2 {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0f1115;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #087f8f;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .add-btn {
            background: #087f8f;
            color: white;
        }

        .add-btn:hover {
            opacity: 0.85;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #171a21;
            border-radius: 15px;
            padding: 15px;
            overflow: hidden;
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            background: white;
            border-radius: 10px;
        }

        .product-card h3 {
            margin-top: 15px;
            margin-bottom: 8px;
        }

        .product-card p {
            color: #aaa;
            margin-bottom: 15px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .edit-btn {
            background: #444;
            color: white;
        }

        .delete-btn {
            background: #b3261e;
            color: white;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="admin-container">

        <h1>Black Box Admin Panel</h1>
        <p class="subtitle">Manage your shoe products</p>


        <!-- Add Product -->

        <div class="admin-box">

            <h2>Add New Product</h2>

            <div class="form-group">
                <label>Product Name</label>
                <input type="text" id="product-name" placeholder="Enter product name">
            </div>

            <div class="form-group">
                <label>Price</label>
                <input type="number" id="product-price" placeholder="Enter price">
            </div>

            <div class="form-group">
                <label>Image URL</label>
                <input type="text" id="product-image" placeholder="Enter image URL">
            </div>

            <button class="add-btn" id="add-product">
                Add Product
            </button>

        </div>


        <!-- Products -->

        <div class="admin-box">

            <h2>Products</h2>

            <div class="products" id="admin-products">
                <!-- Products yahan show honge -->
            </div>

        </div>

    </div>

    const API_URL = "http://localhost:5000/api/products";


// Products load karna
async function loadProducts() {

    const response = await fetch(API_URL);

    const products = await response.json();

    const container = document.getElementById("admin-products");

    container.innerHTML = "";

    products.forEach(function(product) {

        container.innerHTML += `
            <div class="product-card">

                <img src="${product.image}" alt="${product.name}">

                <h3>${product.name}</h3>

                <p>Rs. ${product.price}</p>

                <div class="actions">

                    <button class="edit-btn"
                        onclick="editProduct(${product.id})">
                        Edit
                    </button>

                    <button class="delete-btn"
                        onclick="deleteProduct(${product.id})">
                        Delete
                    </button>

                </div>

            </div>
        `;

    });
}


// Add Product
document.getElementById("add-product").addEventListener("click", async function() {

    const name = document.getElementById("product-name").value;
    const price = document.getElementById("product-price").value;
    const image = document.getElementById("product-image").value;

    if (!name || !price || !image) {
        alert("Please fill all fields!");
        return;
    }

    const response = await fetch(API_URL, {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            name: name,
            price: Number(price),
            image: image
        })

    });

    const data = await response.json();

    alert(data.message);

    document.getElementById("product-name").value = "";
    document.getElementById("product-price").value = "";
    document.getElementById("product-image").value = "";

    loadProducts();

});


// Delete Product
async function deleteProduct(id) {

    const confirmDelete = confirm("Are you sure you want to delete this product?");

    if (!confirmDelete) {
        return;
    }

    const response = await fetch(`${API_URL}/${id}`, {

        method: "DELETE"

    });

    const data = await response.json();

    alert(data.message);

    loadProducts();

}


// Edit Product
async function editProduct(id) {

    const name = prompt("Enter new product name:");

    if (!name) {
        return;
    }

    const price = prompt("Enter new price:");

    if (!price) {
        return;
    }

    const image = prompt("Enter new image URL:");

    if (!image) {
        return;
    }

    const response = await fetch(`${API_URL}/${id}`, {

        method: "PUT",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            name: name,
            price: Number(price),
            image: image
        })

    });

    const data = await response.json();

    alert(data.message);

    loadProducts();

}


loadProducts();
    </script>

</body>
